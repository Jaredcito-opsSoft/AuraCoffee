  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- MOCK DATABASE ---

    const INITIAL_CUSTOMERS = [

      { id: 2, name: 'Roberto Domínguez', phone: '9619876543', points: 45 },

    ];

    const INITIAL_INVENTORY = [
      { id: 1, name: 'Café Grano Chiapas Tostado', cat: 'Granos', stock: 18000, min: 3000, unit: 'g', cost: 0.35, status: 'optimal' },
      { id: 2, name: 'Café Grano Oaxaca Lavado', cat: 'Granos', stock: 2200, min: 2500, unit: 'g', cost: 0.42, status: 'critical' },
      { id: 3, name: 'Leche Entera Santa Clara', cat: 'Lácteos', stock: 28000, min: 6000, unit: 'ml', cost: 0.03, status: 'optimal' },
      { id: 4, name: 'Bebida de Avena Barista', cat: 'Lácteos', stock: 4200, min: 3000, unit: 'ml', cost: 0.07, status: 'warning' },
      { id: 5, name: 'Jarabe Vainilla de Papantla', cat: 'Jarabes', stock: 2500, min: 500, unit: 'ml', cost: 0.22, status: 'optimal' },
      { id: 6, name: 'Vaso Biodegradable 12oz', cat: 'Vasos', stock: 85, min: 150, unit: 'pza', cost: 3.80, status: 'critical' },
      { id: 7, name: 'Croissant Francés Mantequilla', cat: 'Panadería', stock: 24, min: 8, unit: 'pza', cost: 21.00, status: 'optimal' },
      { id: 8, name: 'Panini Serrano y Gouda', cat: 'Cocina', stock: 14, min: 5, unit: 'pza', cost: 48.00, status: 'optimal' },
    ];

    const INITIAL_KDS_ORDERS = [
      {
        id: 1,
        folio: 'CMD-0001',
        type: 'dine_in',
        table: 'M-02',
        customer: 'Mariana Gómez',
        elapsed: 4,
        items: [
          { id: 1, name: 'Flat White Australiano (8oz)', qty: 1, mods: ['Leche de Avena (+ $15)'], notes: 'Poco caliente, en taza de barro', status: 'preparing' },
          { id: 2, name: 'Croissant Francés de Mantequilla', qty: 1, mods: [], notes: '', status: 'ready' },
        ]
      },
      {
        id: 2,
        folio: 'CMD-0002',
        type: 'takeaway',
        table: null,
        customer: 'Roberto D.',
        elapsed: 8,
        items: [
          { id: 3, name: 'Cold Brew Macerado 18h', qty: 2, mods: ['Caramelo Salado (+ $12)'], notes: 'Mucho hielo', status: 'pending' },
        ]
      },
      {
        id: 3,
        folio: 'CMD-0003',
        type: 'dine_in',
        table: 'T-01',
        customer: 'Familia Zenteno',
        elapsed: 12,
        items: [
          { id: 4, name: 'Panini Serrano, Gouda y Pesto', qty: 2, mods: [], notes: 'Bien tostado al grill', status: 'preparing' },
          { id: 5, name: 'Café Latte de la Casa (16oz)', qty: 2, mods: ['Shot Extra Espresso (+ $15)'], notes: '', status: 'pending' },
        ]
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      // User auth state
      const [user, setUser] = useState({ id: 1, name: 'Ana Morales', role: 'cashier' });
      const [currentView, setCurrentView] = useState('pos'); // pos, kds, inventory, cash, dashboard, products

      // POS state
      const [cart, setCart] = useState([]);
      const [orderType, setOrderType] = useState('takeaway'); // takeaway, dine_in
      const [selectedTable, setSelectedTable] = useState('M-01');
      const [customerName, setCustomerName] = useState('');
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      const [selectedCategory, setSelectedCategory] = useState(1);
      const [searchQuery, setSearchQuery] = useState('');

      // Customization Modal
      const [customizingProduct, setCustomizingProduct] = useState(null);
      const [selectedVariant, setSelectedVariant] = useState(null);
      const [selectedMods, setSelectedMods] = useState([]);
      const [itemNotes, setItemNotes] = useState('');

      // Payment & Ticket Modal
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [cashGiven, setCashGiven] = useState(0);
      const [completedTicket, setCompletedTicket] = useState(null);

      // KDS Orders state
      const [kdsOrders, setKdsOrders] = useState(INITIAL_KDS_ORDERS);
      const [kdsStation, setKdsStation] = useState('all');

      // Inventory state
      const [inventory, setInventory] = useState(INITIAL_INVENTORY);
      const [stockModal, setStockModal] = useState(null); // { type: 'entry'|'waste', item }
      const [stockQty, setStockQty] = useState('');
      const [stockReason, setStockReason] = useState('');

      // Cash session state
      const [cashSession, setCashSession] = useState({
        isOpen: true,
        register: 'Caja Mostrador Principal (CAJA-01)',
        openedAt: '08:00 AM',
        initialBalance: 500,
        expectedCash: 1240,
        cardSales: 1680,
        transferSales: 0,
        tips: 150,
        ticketCount: 18,
      });
      const [corteZModal, setCorteZModal] = useState(false);
      const [blindCash, setBlindCash] = useState(1240);

      // System clock
      const [clock, setClock] = useState('');
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setClock(now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        };
        updateClock();
        const t = setInterval(updateClock, 1000);
        return () => clearInterval(t);
      }, []);

      // Calculate Cart totals
      const cartSubtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
      const cartTotal = cartSubtotal;

      // Handle Adding item to Cart
      const handleProductClick = (product) => {
        if (!product.available) return;
        if (product.variants || product.hasMods) {
          setCustomizingProduct(product);
          setSelectedVariant(product.variants ? product.variants[0] : null);
          setSelectedMods([]);
          setItemNotes('');
        } else {
          addItemToCart(product, null, [], '');
        }
      };

      const addItemToCart = (product, variant, mods, notes) => {
        const basePrice = variant ? variant.price : product.price;
        const modsPrice = mods.reduce((acc, m) => acc + m.price, 0);
        const unitPrice = basePrice + modsPrice;
        const key = `${product.id}_${variant ? variant.name : ''}_${mods.map(m => m.id).sort().join('-')}_${notes}`;

        setCart(prev => {
          const idx = prev.findIndex(i => i.key === key);
          if (idx > -1) {
            const next = [...prev];
            next[idx].qty += 1;
            next[idx].totalPrice = next[idx].qty * unitPrice;
            return next;
          }
          return [...prev, {
            key,
            id: product.id,
            name: product.name,
            variantName: variant ? variant.name : '',
            mods,
            notes,
            unitPrice,
            qty: 1,
            totalPrice: unitPrice,
          }];
        });
      };

      const updateCartQty = (key, delta) => {
        setCart(prev => prev.map(item => {
          if (item.key === key) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty, totalPrice: newQty * item.unitPrice } : null;
          }
          return item;
        }).filter(Boolean));
      };

      // Send Order to KDS
      const handleSendToKds = () => {
        if (cart.length === 0) return;
        const folio = `CMD-000${kdsOrders.length + 1}`;
        const newOrder = {
          id: Date.now(),
          folio,
          type: orderType,
          table: orderType === 'dine_in' ? selectedTable : null,
          customer: customerName || (selectedCustomer ? selectedCustomer.name : 'Cliente Mostrador'),
          elapsed: 0,
          items: cart.map((i, idx) => ({
            id: Date.now() + idx,
            name: `${i.name} ${i.variantName ? `(${i.variantName})` : ''}`,
            qty: i.qty,
            mods: i.mods.map(m => m.name),
            notes: i.notes,
            status: 'pending',
          }))
        };
        setKdsOrders(prev => [newOrder, ...prev]);
        setCart([]);
        setCustomerName('');
        alert(`✨ Comanda ${folio} enviada a Barra en tiempo real.`);
      };

      // Open Checkout
      const handleOpenCheckout = () => {
        if (cart.length === 0) return;
        setCashGiven(cartTotal);
        setShowPaymentModal(true);
      };

      // Confirm Payment
      const handleConfirmPayment = () => {
        const ticketFolio = `TKT-000${cashSession.ticketCount + 1}`;
        const change = Math.max(0, cashGiven - cartTotal);
        
        // Update cash session
        if (paymentMethod === 'cash') {
          setCashSession(prev => ({
            ...prev,
            expectedCash: prev.expectedCash + cartTotal,
            ticketCount: prev.ticketCount + 1,
          }));
        } else {
          setCashSession(prev => ({
            ...prev,
            cardSales: prev.cardSales + cartTotal,
            ticketCount: prev.ticketCount + 1,
          }));
        }

        // Also push to KDS
        handleSendToKds();

        setCompletedTicket({
          folio: ticketFolio,
          total: cartTotal,
          paymentMethod,
          cashGiven,
          change,
          items: [...cart],
          time: new Date().toLocaleTimeString(),
        });

        setShowPaymentModal(false);
      };

      // KDS Status Transition
      const advanceItemStatus = (orderId, itemId) => {
        setKdsOrders(prev => prev.map(order => {
          if (order.id === orderId) {
            const nextItems = order.items.map(item => {
              if (item.id === itemId) {
                const nextStatus = item.status === 'pending' ? 'preparing' : item.status === 'preparing' ? 'ready' : 'delivered';
                return { ...item, status: nextStatus };
              }
              return item;
            });
            return { ...order, items: nextItems };
          }
          return order;
        }));
      };

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-[#0F0C08] text-[#FDF8F0] font-sans">
          
          {/* SIDEBAR */}
          <aside className="w-64 bg-[#14100B] border-r border-[#2A2016] flex flex-col justify-between shrink-0 select-none">
            <div>
              {/* Brand */}
              <div className="p-4 border-b border-[#2A2016] flex items-center gap-3">

                  ☕

                <div>

                </div>
              </div>

              {/* Status Pill */}
              <div className="p-3">
                <div className="px-3 py-2 rounded-xl bg-emerald-950/30 border border-emerald-800/40 text-emerald-300 flex items-center justify-between text-xs">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span className="font-medium text-[11px] truncate max-w-[120px]">Caja 01 Abierta</span>
                  </div>
                  <span className="text-[10px] font-mono text-emerald-400/80">$1,240</span>
                </div>
              </div>

              {/* Nav Links */}
              <nav className="px-3 space-y-1">
                {[
                  { id: 'pos', label: 'Terminal POS', icon: '🛍️' },
                  { id: 'kds', label: 'Pantalla KDS', icon: '👨‍🍳', badge: kdsOrders.length },
                  { id: 'inventory', label: 'Inventario & Kardex', icon: '📦' },
                  { id: 'cash', label: 'Caja & Turnos', icon: '💵' },
                  { id: 'dashboard', label: 'Métricas & Ventas', icon: '📊' },
                  { id: 'products', label: 'Catálogo de Productos', icon: '☕' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setCurrentView(item.id)}
                    className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      currentView === item.id
                        ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30 shadow-inner'
                        : 'text-stone-400 hover:text-stone-200 hover:bg-[#1E1811]'
                    }`}
                  >
                    <div className="flex items-center gap-2.5">
                      <span className="text-base">{item.icon}</span>
                      <span>{item.label}</span>
                    </div>
                    {item.badge > 0 && (
                      <span className="px-1.5 py-0.5 rounded-full bg-amber-500 text-stone-950 text-[10px] font-bold font-mono">
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            {/* User switch footer */}
            <div className="p-3 border-t border-[#2A2016] bg-[#100C08]">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-stone-800 border border-stone-700 flex items-center justify-center text-xs text-amber-400 font-bold">
                    {user.name[0]}
                  </div>
                  <div className="leading-tight">
                    <p className="text-xs font-semibold text-stone-200">{user.name}</p>
                    <span className="text-[10px] text-amber-500 capitalize">{user.role}</span>
                  </div>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-1 text-[10px]">
                <button
                  onClick={() => setUser({ id: 1, name: 'Ana Morales', role: 'cashier' })}
                  className={`py-1 rounded border text-center transition-colors ${user.role === 'cashier' ? 'border-amber-500 text-amber-300 bg-amber-500/10' : 'border-[#2A2016] text-stone-400 hover:bg-stone-800'}`}
                >
                  Cajera
                </button>
                <button
                  onClick={() => { setUser({ id: 2, name: 'Mateo Rivas', role: 'barista' }); setCurrentView('kds'); }}
                  className={`py-1 rounded border text-center transition-colors ${user.role === 'barista' ? 'border-amber-500 text-amber-300 bg-amber-500/10' : 'border-[#2A2016] text-stone-400 hover:bg-stone-800'}`}
                >
                  Barista
                </button>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
            {/* Top Navbar */}
            <header className="h-12 bg-[#14100B] border-b border-[#2A2016] px-5 flex items-center justify-between shrink-0 select-none">
              <div className="flex items-center gap-3">
                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span className="text-xs font-semibold text-stone-300">Terminal Principal TPV-01</span>
                <span className="text-stone-700">|</span>
                <span className="text-xs text-amber-400 font-mono">Modo Demo Activo (Full Offline)</span>
              </div>
              <div className="flex items-center gap-4">
                <div className="px-2.5 py-0.5 rounded-lg bg-[#0F0C08] border border-[#2A2016] font-mono text-xs text-amber-400 font-bold">
                  {clock || '12:00:00'}
                </div>
              </div>
            </header>

            {/* VIEW ROUTER */}
            <main className="flex-1 overflow-hidden p-4">
              
              {/* 1. POS TERMINAL VIEW */}
              {currentView === 'pos' && (
                <div className="flex h-full gap-4">
                  {/* Catalog Area */}
                  <div className="flex-1 flex flex-col min-w-0 bg-[#14100B] border border-[#2A2016] rounded-2xl overflow-hidden">
                    {/* Category tabs & Search */}
                    <div className="p-3.5 border-b border-[#2A2016] bg-[#18130C] space-y-3">
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={searchQuery}
                          onChange={e => setSearchQuery(e.target.value)}
                          placeholder="Buscar bebida, postre o panini..."
                          className="flex-1 bg-[#100C08] border border-[#2E2419] rounded-xl px-3.5 py-1.5 text-xs text-stone-100 placeholder-stone-500 focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div className="flex gap-2 overflow-x-auto pb-1">
                        <button
                          onClick={() => setSelectedCategory('all')}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                            selectedCategory === 'all' ? 'bg-amber-500 text-stone-950 font-bold' : 'bg-[#20180F] text-stone-300 border border-[#34271A]'
                          }`}
                        >
                          Todos
                        </button>
                        {INITIAL_CATEGORIES.map(cat => (
                          <button
                            key={cat.id}
                            onClick={() => setSelectedCategory(cat.id)}
                            className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-1.5 transition-all ${
                              selectedCategory === cat.id ? 'bg-amber-500 text-stone-950 font-bold' : 'bg-[#20180F] text-stone-300 border border-[#34271A]'
                            }`}
                          >
                            <span>{cat.icon}</span>
                            <span>{cat.name}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Products Grid */}
                    <div className="flex-1 overflow-y-auto p-3.5 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                      {INITIAL_PRODUCTS
                        .filter(p => (selectedCategory === 'all' || p.catId === selectedCategory) && (!searchQuery || p.name.toLowerCase().includes(searchQuery.toLowerCase())))
                        .map(p => (
                          <button
                            key={p.id}
                            onClick={() => handleProductClick(p)}
                            className="bg-[#18130C] hover:bg-[#20180F] border border-[#2E2419] hover:border-amber-500/60 rounded-2xl p-3 text-left flex flex-col justify-between h-32 transition-all active:scale-[0.98]"
                          >

          {showPaymentModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-[#18130C] border border-[#2E2419] rounded-3xl p-5 space-y-4">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="font-serif text-lg font-bold text-stone-100">Cobro de Orden</h3>
                    <p className="text-xs text-amber-400">{orderType === 'dine_in' ? `Mesa: ${selectedTable}` : 'Para Llevar'}</p>
                  </div>
                  <button onClick={() => setShowPaymentModal(false)} className="text-stone-400">✕</button>
                </div>

                <div className="p-3 bg-[#100C08] border border-[#2A2016] rounded-xl text-center">
                  <span className="text-[10px] text-stone-500 font-mono block">TOTAL A COBRAR</span>
                  <span className="font-serif text-2xl font-bold text-amber-400">${cartTotal}.00 MXN</span>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setPaymentMethod('cash')}
                    className={`py-2 rounded-xl text-xs font-bold border ${paymentMethod === 'cash' ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'border-[#2A2016] text-stone-400'}`}
                  >
                    💵 Efectivo
                  </button>
                  <button
                    onClick={() => setPaymentMethod('card')}
                    className={`py-2 rounded-xl text-xs font-bold border ${paymentMethod === 'card' ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'border-[#2A2016] text-stone-400'}`}
                  >
                    💳 Tarjeta
                  </button>
                </div>

                {paymentMethod === 'cash' && (
                  <div className="space-y-2">
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">Efectivo Recibido:</label>
                      <input
                        type="number"
                        value={cashGiven}
                        onChange={e => setCashGiven(Number(e.target.value))}
                        className="w-full bg-[#100C08] border border-[#2E2419] rounded-xl px-3 py-2 text-lg font-mono font-bold text-stone-100"
                      />
                    </div>
                    <div className="p-2.5 rounded-xl bg-emerald-950/30 border border-emerald-800/40 flex justify-between text-xs font-mono">
                      <span className="text-emerald-300 font-bold">Cambio a Devolver:</span>
                      <span className="font-bold text-emerald-400">${Math.max(0, cashGiven - cartTotal)}.00 MXN</span>
                    </div>
                  </div>
                )}

                <button
                  onClick={handleConfirmPayment}
                  className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold rounded-xl text-xs"
                >
                  Confirmar Cobro y Emitir Ticket
                </button>
              </div>
            </div>
          )}

          {/* TICKET MODAL */}
          {completedTicket && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-xs bg-[#18130C] border border-[#2E2419] rounded-3xl p-5 space-y-4">
                <div className="text-center">
                  <span className="text-2xl">☕</span>
                  <h3 className="font-serif font-bold text-stone-100 text-base">BREWDESK CAFÉ</h3>
                  <p className="text-[10px] text-stone-400">Folio: {completedTicket.folio}</p>
                </div>

                <div className="bg-[#100C08] border border-[#2A2016] rounded-xl p-3 font-mono text-xs space-y-1 text-stone-300">
                  <div className="border-b border-[#2A2016] pb-1 space-y-0.5">
                    {completedTicket.items.map((it, idx) => (
                      <div key={idx} className="flex justify-between">
                        <span>{it.qty}x {it.name}</span>
                        <span>${it.totalPrice}.00</span>
                      </div>
                    ))}
                  </div>
                  <div className="flex justify-between font-bold pt-1 text-amber-400">
                    <span>TOTAL:</span>
                    <span>${completedTicket.total}.00 MXN</span>
                  </div>
                  {completedTicket.paymentMethod === 'cash' && (
                    <div className="flex justify-between text-emerald-400 text-[10px]">
                      <span>Cambio entregado:</span>
                      <span>${completedTicket.change}.00</span>
                    </div>
                  )}
                </div>

                <div className="flex gap-2">
                  <button onClick={() => window.print()} className="flex-1 py-2 bg-[#20180F] border border-[#34271A] rounded-xl text-xs font-bold text-stone-300">Imprimir</button>
                  <button onClick={() => setCompletedTicket(null)} className="flex-1 py-2 bg-amber-500 rounded-xl text-xs font-bold text-stone-950">Aceptar</button>
                </div>
              </div>
            </div>
          )}

          {/* CORTE Z MODAL */}
          {corteZModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-[#18130C] border border-[#2E2419] rounded-3xl p-5 space-y-3">
                <h3 className="font-serif font-bold text-stone-100 text-base">Corte Z (Cierre de Turno)</h3>
                <p className="text-xs text-stone-400">Introduce el efectivo contado físicamente en cajón:</p>
                <input
                  type="number"
                  value={blindCash}
                  onChange={e => setBlindCash(Number(e.target.value))}
                  className="w-full bg-[#100C08] border border-[#2E2419] rounded-xl px-3 py-2 font-mono font-bold text-lg text-amber-400"
                />
                <div className="p-2.5 rounded-xl bg-[#100C08] border border-[#2A2016] text-xs font-mono flex justify-between">
                  <span>Diferencia:</span>
                  <span className={blindCash - cashSession.expectedCash === 0 ? 'text-emerald-400 font-bold' : 'text-red-400 font-bold'}>
                    ${(blindCash - cashSession.expectedCash).toFixed(2)} MXN
                  </span>
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setCorteZModal(false)} className="flex-1 py-2 bg-[#20180F] border border-[#34271A] rounded-xl text-xs text-stone-300">Cancelar</button>
                  <button
                    onClick={() => {
                      alert('Turno cerrado con éxito. Comprobante de Corte Z generado.');
                      setCorteZModal(false);
                    }}
                    className="flex-1 py-2 bg-red-600 rounded-xl text-xs font-bold text-stone-100"
                  >
                    Confirmar Cierre
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
